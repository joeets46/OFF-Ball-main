[project]
name = "offsim"
version = "0.1.0"
description = "Seeded fake data generator for the OFF-Ball tracking schema: football off-ball player tracking"
requires-python = ">=3.11"
license = { text = "MIT" }

# psycopg is the only dependency, and only the database sink needs it. The
# world itself is pure standard library, so it can be built and tested anywhere.
dependencies = ["psycopg[binary]>=3.2"]

[project.scripts]
offsim = "offsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offsim"]
